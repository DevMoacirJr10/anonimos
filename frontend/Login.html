<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Anonimos MMLNT - Criar Conta</title>
    <link rel="stylesheet" href="Login.css" />
    <link rel="icon" href="assets/img/sputfoguete.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Joan&family=Jockey+One&display=swap"
      rel="stylesheet"
    />
</head>
<body>

<div class="container">

    <!-- CENÁRIO -->
    <div class="space">
        <img src="assets/img/lua.png" class="lua">
        <img src="assets/img/terra.png" class="terra">
        <img src="assets/img/sputfoguete.png" class="sput">
        <img src="assets/img/meteoro.png" class="M1">
        <img src="assets/img/meteoro.png" class="M2">
        <img src="assets/img/meteoro.png" class="M3">
    </div>

    <!-- FORMULÁRIO -->
    <div class="form-box">
        <h2>CRIAR UMA CONTA</h2>

        <input type="text" placeholder="Seu nome:">
        <input type="email" placeholder="E-mail:">
        <input type="tel" placeholder="Número de telefone:">
        <input type="password" placeholder="Crie uma nova senha:">
        <input type="password" placeholder="Confirme sua nova senha:">
        <button>Criar conta</button>
    </div>

</div>

<script src="Login.js"></script>
</body>
</html>
