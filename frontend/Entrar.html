<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anônimos MMLNT - Login</title>
    <link rel="stylesheet" href="Entrar.css" />
    <link rel="icon" href="assets/img/luminho.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Joan&family=Jockey+One&display=swap"
      rel="stylesheet"
    />
    <!-- GSAP (opcional para animar depois!!) --> 
    <script src="https://unpkg.com/gsap@3/dist/gsap.min.js"></script>
  </head>
  <body>
    <main class="container">
      <!-- LADO ESQUERDO -->
      <img src="assets/img/cometa.png" class="comet" />
      <section class="login-area">
        <div class="text-content">
          <h1 class="logo-name1">ANÔNIMOS</h1>
          <h2 class="logo-name2">MMLNT</h2>
          <div class="form">
            <input  type="text" placeholder="Login:" />
            <input type="password" placeholder="Senha:" />
            <button class="btn-login">LOGIN</button>
          </div>

          <p class="register-text">Não possui uma conta?</p>
          <button class="btn-register">Crie uma aqui!</button>
        </div>
      </section>

      <!-- LADO DIREITO (ESPAÇO) -->
      <section class="space-area">
        <img src="assets/img/sol.png" class="sun" />
        <img src="assets/img/mercurio.png" class="planet merc" />
        <img src="assets/img/venus.png" class="planet venu" />
        <img src="assets/img/terra.png" class="planet terr" />
        <img src="assets/img/marte.png" class="planet mart" />
        <img src="assets/img/jupiter.png" class="planet jupi" />
        <img src="assets/img/saturno.png" class="planet satu" />
        <img src="assets/img/urano.png" class="planet uran" />
        <img src="assets/img/netuno.png" class="planet netu" />
      </section>
    </main>

    <script src="Entrar.js"></script>
  </body>
</html>
